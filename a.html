 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(D)));
 try{sessionStorage.setItem('edo_pw',pw)}catch(e){}
 document.open();document.write(h);document.close();}
const saved=(()=>{try{return sessionStorage.getItem('edo_pw')}catch(e){return null}})();
if(saved)open(saved).catch(()=>{});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
 open(document.getElementById('p').value).catch(()=>{document.getElementById('e').textContent='パスワードがちがいます。'})});
</script></body></html>
